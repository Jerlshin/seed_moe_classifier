# Seed dataset, splits and the multi-crop view policy (paper Sections 3 and 4).
#
# This is the ONLY data group. It carries the current, canonical view recipe --
# the one sized for this corpus, not the one inherited from ImageNet. The
# reference (submitted) geometry is still reachable, as a set of overrides, and
# `conf/stage1_arms/view_design.yaml` runs it as the `wo_view_redesign` arm.
#
# Layout expected under `root_path`:
#
#   root/<seed_type>/<sub_variety>/*.png
#
# Labels come from *sorted* directory names, and sub-variety labels are global
# (0..26 across all seed types). Adding or renaming a folder shifts every index
# and invalidates existing checkpoints.

root_path: "${oc.env:SEED_DATA_ROOT,data/Hierarchical_SeedData/Cropped_Samples}"
dataset_format: "image_folder"   # or "pickle_batches" for flattened-RGB batch files

# Optional `RAW_Samples` tree, for the coverage audit only. Nothing reads pixels
# from it: when set, the trainers and the stage-1 evaluation report which source
# photographs exist and were never cropped, because SCENE count -- not crop
# count -- is the binding constraint on photograph-disjoint generalisation.
# 18 of 99 photographs are uncropped on the shipped corpus. Cropping them is a
# deliberate re-baseline (every published accuracy moves), which is why this key
# reports and never acts. See scripts/report_raw_photographs.py.
raw_photographs_root: "${oc.env:SEED_RAW_DATA_ROOT,null}"

# Must match the backbone's window resolution (256 for swinv2_*_window16_256).
image_size: 256

# 160, not torchvision's habitual small local crop. The local view is emitted at
# this size and upsampled to `image_size` on the GPU; raising it removes the
# intermediate as a second low-pass and costs 2.5x the collate bandwidth of a
# 101 px view, which is still 2.6x cheaper than emitting at 256.
local_crop_size: 160

batch_size: 16                   # stage-2 default; stage 1 raises it to 64
pin_memory: true
drop_last: true
save_csv_path: "${oc.env:SEED_OUTPUT_DIR,outputs}/metadata/seed_dataset.csv"

# ---------------------------------------------------------------------------
# Loader throughput.
#
# Stage 1 builds SIX independent PIL pipelines per sample (random resized crop,
# colour jitter, grayscale, Gaussian blur, solarization, normalize). At
# batch_size 16 that is 96 augmentation chains per batch, against a single
# backbone forward the GPU finishes in well under a second. Two workers cannot
# keep up, and the symptom is exactly the one this pipeline showed: a GPU at
# ~40 % power draw. The trainer logs `loop_blocked_fraction` every logging step --
# the share of wall clock spent blocked waiting for a batch. Raise num_workers
# until it stops falling; the useful ceiling is roughly the physical core count.
#
# persistent_workers keeps the pool alive between epochs. With 584 batches per
# epoch and 300 epochs, respawning costs several hundred pool restarts, and each
# one also empties the prefetch queue so every epoch begins with an idle GPU.
#
# prefetch_factor is the per-worker read-ahead depth. The default of 2 is thin
# cover for a pipeline whose per-batch CPU cost is this bursty.
#
# num_workers is PER PROCESS, so under DDP the configured value is spawned once
# per rank. "auto" resolves to the affinity-aware usable core count divided by
# the number of local ranks, capped at `num_workers_auto_cap` below -- 16 on a
# server and 2 per rank on a Kaggle T4x2 instance (4 vCPUs, 2 ranks), where a
# literal 16 would put 32 augmentation workers on 4 cores and spend the epoch
# context-switching. An explicit integer is divided by the local rank count with
# a log line saying so.
# ---------------------------------------------------------------------------
num_workers: "auto"

# Ceiling on what `num_workers: "auto"` resolves to, per rank.
#
# Raised from 8 to 16. The 8 was chosen for a 4-vCPU Kaggle T4x2 and became a
# limiter everywhere else: the previous 13.34-hour stage-1 run carried
# `num_workers=0` on a 48-physical-core host and spent a mean 91.6 % of its wall
# clock blocked in the dataloader. One sample costs six independent PIL chains,
# so the per-image CPU cost is ~59 ms and the loader -- not the GPU -- sets the
# throughput.
#
# This changes who computes an augmentation, never what it is: the objective,
# the RNG streams and every reported number are unaffected. Watch
# `epoch/loop_blocked_fraction` in epoch 1; if it does not fall below ~0.3 the
# bottleneck is elsewhere and every cost estimate has to be redone.
num_workers_auto_cap: 16

persistent_workers: true
prefetch_factor: 4

# Hold every decoded image in one shared RAM buffer.
#
# The 9,357 crops have a median size of 52 x 51 px, so the whole dataset decodes
# to roughly 75 MB -- for which a 300-epoch run would otherwise pay 2.8 million
# PNG decodes, on the very workers that are failing to keep the GPU fed. Under
# `fork` the buffer is shared copy-on-write across workers; the loader disables
# the cache automatically under `spawn`, where "sharing" would mean one full
# copy per worker.
cache_images: true
cache_limit_mb: 4096

# Paper Section 3: 4 seed types, 27 sub-varieties (13 rice, 8 millet, 3 + 3).
num_seed_types: 4
num_sub_varieties: 27

# How many crops the corpus is supposed to contain. `null` disables the check;
# any integer makes a disagreement FATAL at startup, before a GPU-hour is spent.
#
# This is not defensive coding. An earlier 100-epoch encoder was self-distilled
# on 8,173 crops while the evaluation, stage 2 and every published number used
# 9,357, nothing on disk recorded it, and it was recoverable only by cross-
# reading two log lines against `metrics.json`. `corpus_fingerprint` makes that
# discoverable afterwards; this makes it impossible in the first place. Set it to
# null only while the corpus is being changed on purpose (e.g. after cropping the
# 18 unused photographs).
expected_num_samples: 9357

# ---------------------------------------------------------------------------
# Multi-crop augmentation.
#
# WHY THESE RANGES, AND NOT DINO'S
# ================================
#
# `RandomResizedCrop`'s `scale` is a fraction of the SOURCE area. On ImageNet the
# source is a whole scene and a 5 % crop is still a recognisable object part.
# Here the source is already a tight crop of ONE SEED at a median 52 x 51 px, so
# the reference recipe is not sampling part of a scene -- it is shredding the
# object.
#
# Measured over all 9,357 crops with torchvision's own `get_params`, 40,000 draws
# at seed 7 (`scripts/report_view_geometry.py` reproduces every row):
#
#   view recipe                            native px p5/50/95    upsample  real content
#   -------------------------------------  --------------------  --------  ------------
#   global (0.40, 1.00) r=(0.75, 1.33)       648 / 1845 / 5680      6.0x        2.82 %
#   local  (0.05, 0.40) r=(0.75, 1.33)       132 /  598 / 2585     10.5x        0.91 %  <- reference
#   global (0.70, 1.00) r=(0.50, 2.00)       928 / 2484 / 7564      5.1x        3.79 %  <- canonical
#   local  (0.30, 0.70) r=(0.50, 2.00)       483 / 1419 / 4730      6.8x        2.17 %  <- canonical
#
# A local view under the reference recipe is a median 24 x 24 px fragment of one
# seed inflated to 65,536 output pixels, and 8 of the 10 cross-view terms in
# Eq. 1 are anchored on such a view. The canonical policy gives the local views
# 2.37x the content and cuts their upsample from 10.5x to 6.8x, which also
# narrows the local-vs-global resolution gap the student can use as a shortcut.
#
# COLOUR IS SIGNAL HERE
# =====================
#
# Mean RGB alone scores 0.3169 on the 27-way task and explains 78.5 % of the
# between-sub-variety variance; only ~26.6 % of the within-class colour variance
# is photograph-specific, so most of the cue transfers. The jitter is therefore
# split by what it attacks rather than turned down uniformly:
#
#   * brightness / contrast  = illumination = photograph nuisance -> keep at 0.4
#   * saturation / hue       = pigmentation = class signal        -> cut hard
#   * grayscale, solarize    = delete / invert the cue            -> off
#
# What this is NOT claiming: the obvious version of the argument is refuted. Mean
# RGB is *more* linearly decodable after in-domain self-distillation than before
# (pooled R^2 0.864 -> 0.908), so the jitter did not destroy the cue. This is a
# hypothesis about where capacity goes, and `conf/stage1_arms/view_design.yaml`
# runs `wo_colour_policy` as its control.
# ---------------------------------------------------------------------------
augmentation:
  # --------------------------------------------------------------- geometry
  global_crops_scale: [0.70, 1.00]
  local_crops_scale: [0.30, 0.70]
  local_crops_number: 4

  # The aspect-ratio range `RandomResizedCrop` samples.
  #
  # This exists because narrowing the scale range silently spends randomness.
  # `get_params` retries the (area, aspect) draw ten times and then returns a
  # DETERMINISTIC centre crop. Only 3.4 % of these crops are square (aspect
  # p5/p95 = 0.52 / 1.98), so a high-area box in torchvision's (0.75, 1.33)
  # often does not fit: measured fallback rates are 3.5 % at scale (0.40, 1.00),
  # 22.0 % at (0.70, 1.00), and 10.2 % at (0.70, 1.00) once the ratio widens to
  # (0.5, 2.0) -- which also raises the median content further (2,484 vs 2,310
  # native px), so the wider ratio is strictly better on both axes. The trainer
  # measures this at startup and warns above 15 %.
  crop_ratio: [0.5, 2.0]

  # Floor on the native source pixels a view may be built from. Raises the
  # effective lower scale bound per image to max(scale_lo, floor / area) and
  # never lowers it, so it can only make views less destructive; 0 disables it
  # and is byte-identical to a plain RandomResizedCrop. Exists because a fixed
  # *fraction* shreds a 21 x 22 crop and an 881 x 413 crop by the same factor.
  #
  # 0 in the primary run: at (0.30, 0.70) the p5 local view already carries 483
  # native px, and adding a second mechanism to the primary arm would confound it
  # with the scale change. The `native_pixel_floor` arm runs it at 900, which
  # lifts the p5 to 832 (+72 %) and moves the median by 1.1 % -- i.e. it acts only
  # on the worst views, which is the entire claim being tested.
  min_native_pixels: 0

  # The full dihedral group of order 8, losslessly. Seeds photographed on a tray
  # have no canonical orientation, so this is label-preserving *here
  # specifically*. The 90-degree rotations go through PIL's `transpose`, which is
  # a pixel permutation -- no interpolation, no resampling, no black corners --
  # unlike `T.RandomRotation`. This is what buys back the augmentation diversity
  # the narrower crop ranges give up, which is what keeps the narrowing from
  # being a step toward pretext-task memorisation on 81 scenes.
  horizontal_flip_prob: 0.5
  vertical_flip_prob: 0.5
  rotation90_prob: 0.75

  # ------------------------------------------------------------- photometry
  color_jitter_prob: 0.8
  color_jitter_brightness: 0.4    # illumination: nuisance, keep
  color_jitter_contrast: 0.4      # illumination: nuisance, keep
  color_jitter_saturation: 0.1    # pigmentation: signal, halved
  color_jitter_hue: 0.02          # pigmentation: signal. 0.1 is +-36 degrees of hue
  grayscale_prob: 0.0             # deletes the colour cue outright
  solarization_prob: 0.0          # inverts it, which is worse

  # Symmetric across the three view families, so blur no longer identifies which
  # family a view came from. DINO's 1.0 / 0.1 / 0.5 gave the student a second
  # family cue on top of the resolution artefact, and a cue it can use to predict
  # the family's marginal is a cue that substitutes for learning the
  # local-to-global correspondence Eq. 1 exists to teach.
  global_blur_prob_1: 0.5
  global_blur_prob_2: 0.5
  local_blur_prob: 0.5

  # Blur radius range, in pixels of the *output* view. These images carry
  # essentially no content above ~52 px and are then upsampled ~5x, so a wide
  # radius removes real structure rather than a nuisance frequency band.
  blur_radius_min: 0.1
  blur_radius_max: 1.0

  # SwinV2 windows require a fixed input size, so local crops are resized back
  # up to `image_size` after being cropped at `local_crop_size`.
  resize_local_to_global: true

  # -------------------------------------------------------------------------
  # Put the GLOBAL crops through the same downsample-to-`local_crop_size`-then-
  # upsample cycle the local crops necessarily undergo, so the resolution
  # artefact stops identifying a view as local.
  #
  # Off by default because it low-passes the globals too, on data that already
  # has almost no high-frequency content -- the argument for it is theoretical
  # and the argument against it is measurable. The canonical policy narrows the
  # same gap by raising the local scale instead, which costs nothing. Run it as
  # its own arm if you want the measurement.
  # -------------------------------------------------------------------------
  match_view_lowpass: false

  # -------------------------------------------------------------------------
  # Provenance-derived positives. Replace this many of the `local_crops_number`
  # local views with local crops of *other crops from the same source
  # photograph*, which is parsed from the filename (`IMG_0502_bbox137.png`) and
  # involves no labels.
  #
  # The view count is unchanged, so nothing downstream moves. What changes is
  # the invariance being taught: DINO's positives are augmented views of one
  # crop, so it learns invariance to crop/blur/colour, while the downstream task
  # needs invariance to *which individual seed*. Two crops of one photograph are
  # by construction two individuals of the same variety.
  #
  # The risk is self-detecting and must be checked before believing any gain:
  # same-photograph crops share lighting, background and sensor noise, so the
  # objective can be satisfied by learning photograph identity -- exactly what
  # the photograph-disjoint protocol punishes. The evaluation's
  # `nuisance/within_class_photo_accuracy_above_chance` is the gate (in-domain
  # self-distillation drove it from +10.0 pp to +3.5 pp above chance); an arm
  # that pushes it back up learned the confound rather than the variety.
  #
  # 0 disables it, which is the default and the only setting any published
  # number was produced under.
  # -------------------------------------------------------------------------
  same_photo_local_views: 0

  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

  # -------------------------------------------------------------------------
  # Where the last two steps of each view's pipeline run. Neither changes the
  # tensor the backbone sees; both change who computes it.
  #
  # output_uint8: stop at PILToTensor and do `/255 -> normalize` on the GPU.
  #   The tensors that get collated, pinned and pushed over PCIe are then 1 byte
  #   per channel instead of 4.
  #
  # defer_local_upsample: emit local crops at local_crop_size (160) and let the
  #   GPU resize them to image_size (256). A 160 px crop is 2.6x fewer pixels
  #   than the 256 px tensor it becomes, so this is the larger saving of the two
  #   -- four of the six views per sample stop being inflated before transfer.
  #   Implied by output_uint8: the CPU recipe resizes *after* normalisation, on
  #   unclamped floats, and there is no way to apply that resize to a uint8
  #   tensor without clamping and requantising it. See src/datasets/transforms.py.
  #
  # Set both false to put every step back on the dataloader workers.
  # -------------------------------------------------------------------------
  output_uint8: true
  defer_local_upsample: true

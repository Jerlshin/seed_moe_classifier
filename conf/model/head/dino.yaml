# Self-distillation projection head (paper Section 4).
#
# "The projection head consists of a multi-layer perceptron (MLP) with batch
# normalization and GELU activation functions. The final embeddings are
# normalized to facilitate stable self-distillation."
#
# Realised width chain (num_layers counts the linear layers up to and including
# the bottleneck; the prototype layer is separate and weight-normalised):
#
#   in_dim=768 -> 1024 -> 1024 -> 256 -> L2 normalize -> weight_norm(2048)
#
# This head is DISCARDED at the end of stage 1. Nothing downstream depends on
# any width here: the only handoff to stage 2 is `student_backbone`, so the head
# can be resized on evidence about stage 1 alone.

name: "dino_projection"

in_dim: ${model.backbone.feature_dim}

# hidden_dim, RESIZED with the backbone. 2048 was DINO's width for a 65,536-way
# prototype layer; against a 768-channel trunk and 2,048 prototypes it is the
# widest thing in the head for no stated reason. 1024 keeps the MLP at the
# trunk's own scale.
hidden_dim: 1024
bottleneck_dim: 256

# out_dim, RECALIBRATED TWICE.
#
# Table 1's 65,536 is DINO's value, set for ImageNet-1k's 1.28 M images -- 0.051
# prototypes per image. Against 9,357 images that is 7.00 per image, a 137x
# higher density. The first revision cut it to 8,192; this one cuts it to 2,048,
# because prototype count and BATCH SIZE are one decision, not two:
#
#   Sinkhorn-Knopp makes the teacher's assignment doubly stochastic within the
#   batch, so each prototype's column receives exactly B_teacher/K of the mass.
#   At 8,192 prototypes and 2 x 32 = 64 teacher views that is 1/128 of a view per
#   prototype -- the assignment is decided almost entirely by the normaliser
#   rather than by the data, and the entropy floor it imposes (log(K/B_teacher))
#   sits at 4.85 of a 9.01 maximum. At 2,048 the floor is 3.47 of 7.62 and each
#   prototype's column carries 4x more evidence.
#
# 2,048 also removes ~1.5 M parameters from the prototype layer. Set 8192 to
# reproduce the previous revision, 65536 for the submitted configuration.
out_dim: 2048
num_layers: 3

# Head normalisation: "layer" | "batch" | "none".
#
# The paper says batch normalization, and that is what was submitted. But
# `update_momentum` EMAs *parameters*, not *buffers*, so teacher and student
# BatchNorm running statistics diverge -- and the teacher sees 2 views per step
# while the student sees 6, so their batch statistics differ even in principle.
# DINO's official head defaults to use_bn=False for transformer backbones for
# exactly this reason.
use_batch_norm: "layer"

# Weight-normalised final layer with a frozen gain, as in the DINO reference
# implementation; combined with `freeze_last_layer_epochs` this is what keeps
# the first epoch stable.
norm_last_layer: true

# ---------------------------------------------------------------------------
# Auxiliary head on an intermediate trunk stage. An arm, not a default.
#
# null (the default) is plain DINO: one head, on the pooled trunk output.
#
# `aux_stage: 2` attaches a SECOND DINO head, with its own prototypes and its
# own EMA teacher copy, to the mean-pooled output of `layers.2`, and the trainer
# adds `aux_weight * L_aux` to the objective.
#
# The argument for it. `model.backbone.feature_stage=stage3` fixes WHERE stage 2
# reads; it does not fix the fact that the stage-1 gradient reaches `layers.2`
# only through two blocks being optimised for something else. Linear CKA against
# the ImageNet initialisation was 0.103 at `layers.3` against 0.390 at
# `layers.2` on the shipped run -- the objective consumed the last stage. If the
# objective supervises `layers.2` directly, the layer that ships is the layer
# that was trained.
#
# The arguments against, which is why it is off. Two heads is more parameters,
# more prototypes to keep alive and an extra weight to tune, and a multi-level
# objective can make the shallower stage merely mimic the deeper one. It is also
# CONFOUNDED with the `feature_stage` decision: run it after that has been
# settled, never beside it. Judge it on `layerwise_probe/stage3` and on
# `cka_vs_imagenet_init` per stage, which should rise at layers.3 and fall at
# layers.2 -- if `layers.2`'s probe does not move, the answer is no.
#
# `aux_out_dim: null` reuses `out_dim`.
aux_stage: null
aux_out_dim: null
aux_weight: 1.0

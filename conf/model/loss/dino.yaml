# Self-distillation loss (paper Section 4, Eqs. 1-3, Table 1).
#
# Stage 1 is DINO (Caron et al., 2021) with a SwinV2 trunk, plus the two DINOv2
# components that do not need patch tokens: KoLeo and Sinkhorn-Knopp centering.
# It is NOT full DINOv2 -- there is no iBOT patch objective and no untied heads --
# and the paper says so.

name: "dino_self_distillation"

# ---------------------------------------------------------------------------
# Collapse control, RECALIBRATED. Sharpening (low teacher temperature) and
# centering are opposing forces; the submitted configuration set BOTH in the
# collapsing direction at once.
#
# (a) Sharpening was ~2x stronger than reference: 0.02 -> 0.04 against DINO's
#     0.04 -> 0.07, i.e. a converged teacher roughly twice as sharp as DINO's.
# (b) Centering was noise-dominated: C in R^65536 as an EMA at m = 0.9 (a ~10
#     step window) over 2 global crops x batch 16 = 32 teacher vectors per step
#     is ~320 effective samples for 65,536 dimensions -- 0.005 samples per
#     dimension, against DINO's 0.31 at batch 1024.
#
# A partially collapsed run has a perfectly plausible loss curve, so Fig. 6 will
# not reveal any of this. The trainer logs teacher entropy and the prototype
# marginal's KL to uniform, which will.
# ---------------------------------------------------------------------------
warmup_teacher_temp: 0.04
teacher_temp: 0.07
warmup_teacher_temp_epochs: 30

student_temp: 0.1

# Centering: "sinkhorn" | "ema".
#
# Sinkhorn-Knopp normalises the teacher's assignment to be doubly stochastic
# WITHIN the batch, so nothing is estimated across steps and (b) above stops
# being a problem at all. "ema" is Eq. 3, C_t = m*C_{t-1} + (1-m)*qbar.
centering: "sinkhorn"
sinkhorn_iterations: 3

# Multi-GPU only. false (default) normalises the assignment over each rank's own
# micro-batch, which is what REPRODUCES the single-GPU numbers: Sinkhorn is
# already applied per micro-batch under gradient accumulation, so a rank holding
# the same 16 images computes the identical function.
#
# true makes the assignment doubly stochastic over the batch concatenated across
# ranks -- exact (the log-space marginals are reduced across ranks, and
# tests/test_distributed.py pins it against the single-process result on the
# concatenated batch) and arguably better, but it is a DIFFERENT objective from
# the one a single-GPU run optimises, which is why launching on two GPUs does
# not turn it on by itself.
#
# KoLeo has no equivalent switch on purpose: it is a nearest-neighbour statistic
# over the local view block, applied per-rank in the reference DINOv2
# implementation for the same reason.
distributed_sinkhorn: false

# Only consulted by centering: "ema". Raised from 0.9 (a ~10-step window) to a
# ~100-step one, which is the least that makes the estimate meaningful.
center_momentum: 0.99

# ---------------------------------------------------------------------------
# KoLeo regulariser (DINOv2): encourages uniform feature span within a batch, so
# near-duplicate samples do not collapse onto each other. Particularly apt here,
# where 27 sub-varieties of four crops are near-duplicates by construction.
#
# 0.0 is the control that answers "is KoLeo worth anything at all on this data?"
# once it is no longer fighting Eq. 1, and it is one override rather than a fork.
# ---------------------------------------------------------------------------
lambda_koleo: 0.1

# Scope: "per_view" | "all_views".  ** This default is a bug fix. **
#
# The student's global views arrive VIEW-MAJOR, so rows [0:B] are global view 0
# of every image and rows [B:2B] are global view 1 of the SAME images in the same
# order. Handing the whole block to the nearest-neighbour term masks only the
# diagonal, so row i and row B+i -- two augmented views of one crop -- are
# eligible neighbours. Under a working DINO they are the CLOSEST pair in the
# block, so they are the argmin, and the gradient of -log(min distance) pushes
# them apart. That is an explicit anti-alignment force acting on exactly the pair
# Eq. 1 exists to pull together.
#
# On the shipped 100-epoch run this coincided with `alignment` getting WORSE
# (0.638 -> 1.111) and `same_image_minus_same_class` landing at -0.028: the
# objective's own invariance target was not achieved.
#
# "per_view" chunks by view and reduces, which is what DINOv2's ssl_meta_arch.py
# does -- `sum(self.koleo_loss(p) for p in student_cls_tokens.chunk(2))`, with
# the in-source comment "we don't apply koleo loss between cls tokens of a same
# image".
#
# "all_views" restores the pre-audit behaviour. It is kept ONLY so "the fix was
# worth X" is a measurable claim rather than an assertion; it is not a knob.
koleo_scope: "per_view"

# Reduction over the per-view terms: "mean" | "sum".
#
# "mean" keeps lambda_koleo on the same scale as `all_views`, so the two are a
# single-factor comparison. "sum" reproduces DINOv2 literally, which at two
# global views is the identical term at twice the weight.
koleo_reduction: "mean"

# Which space the uniformity is enforced in: "bottleneck" | "backbone".
#
# "bottleneck" is the DINO head's 256-D L2-normalised embedding -- the shipped
# behaviour, and a space stage 2 never sees: only `student_backbone` ships. So
# the regulariser currently acts on features that are discarded, and reaches the
# published encoder only indirectly.
#
# "backbone" applies it to the pooled trunk feature of each global view instead,
# which is what DINOv2 does (`x_norm_clstoken`) and the space downstream actually
# consumes. `koleo_regularizer` L2-normalises internally, so what is regularised
# is the direction, not the norm.
koleo_space: "bottleneck"

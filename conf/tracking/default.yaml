# Experiment tracking. Three sinks: events.jsonl (always), TensorBoard, W&B.
#
#   tensorboard --logdir outputs/hydra
#   wandb sync outputs/hydra/<date>/<time>/wandb/offline-run-*
#
# W&B defaults to `offline` so a run never blocks on network or credentials.
# Switch to `online` once `wandb login` has been run.

experiment_name: "seed-moe"
run_name: null
output_dir: "${hydra:runtime.output_dir}"
log_level: "INFO"
console: true
structured_jsonl: true

snapshot:
  enabled: true
  save_yaml: true
  save_json: true
  save_cli_args: true
  save_environment: false
  redact_env_keys:
    - "KEY"
    - "TOKEN"
    - "SECRET"
    - "PASSWORD"
    - "PASS"
    - "CREDENTIAL"

# Wide-format CSV mirrors of every logged metric, one file per family, written
# to `<run dir>/csv/`. Always on: it has no optional dependency, it survives a
# crash, and it is the artifact an automated analysis loads directly --
# `events.jsonl` is the complete record but needs a parser to become a table.
csv:
  enabled: true
  directory: null      # null -> `${hydra:runtime.output_dir}/csv`

# Figures written to `<run dir>/figures/`. `dpi` applies to the stage-1
# publication suite (`src/utils/stage1_figures.py`), which writes PNG and PDF.
figures:
  dpi: 300

tensorboard:
  enabled: true
  log_dir: "${hydra:runtime.output_dir}/tensorboard"

wandb:
  enabled: true
  project: "seed-moe-classifier"
  entity: null
  mode: "offline"      # "online" | "offline" | "disabled"
  group: null
  tags: []
  log_model: false     # upload checkpoints as W&B artifacts

intervals:
  log_every_steps: 10
  device_every_steps: 50

  # Per-parameter gradient norms cost one host synchronisation PER TENSOR --
  # about 440 of them for a SwinV2-Base student plus its head, each one stalling
  # the CPU until the queued backward drains. The clipped total norm is logged
  # every step for free (the clip computes it anyway), so this breakdown runs on
  # its own, much rarer, interval. 0 disables it.
  gradient_norm_every_steps: 200
  # |dW| / |W| across the trunk, over the interval BETWEEN measurements (not per
  # step). Adam normalises by the second moment, so a gradient norm says nothing
  # about how far the weights actually moved -- this is the quantity that does,
  # and it is what would have settled the audit's "the patch embedding is
  # drifting" argument directly instead of by CKA. Because the interval sets the
  # scale, two runs are comparable only at the same value here. Costs one device
  # clone per parameter tensor (~110 MB for SwinV2-Tiny, held until the next
  # measurement) and no host synchronisation. 0 disables it.
  update_ratio_every_steps: 200
  histogram_every_epochs: 5
  gradient_histogram_every_epochs: 5
  embedding_every_epochs: 5
  attention_every_epochs: 5
  figure_every_epochs: 5   # confusion matrices, expert utilisation, t-SNE

  # Per-term gradient probe. Costs one extra backward per loss term, so it runs
  # rarely. It is the direct empirical test for the conflicts a seven-term
  # objective invites: does L_cos oppose L_ArcFace, does L_KL oppose L_seed.
  # Set to 0 to disable.
  gradient_probe_every_steps: 50

artifacts:
  # Parameter/gradient histograms are large; keep them off for long runs.
  log_parameter_histograms: false
  log_gradient_histograms: false
  log_gradient_norms: true
  # Per-term gradient norms and pairwise cosines at the last shared layer.
  log_per_term_gradients: true

  # Paper Section 6 qualitative results.
  log_confusion_matrices: true
  log_expert_utilization: true
  log_per_class_tables: true
  log_tsne: true
  log_embeddings: false
  log_attention_maps: false

  max_embedding_samples: 64
  max_attention_images: 2
  max_tsne_samples: 2000
  tsne_perplexity: 30.0

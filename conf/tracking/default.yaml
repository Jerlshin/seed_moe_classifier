# Experiment tracking. Three sinks: events.jsonl (always), TensorBoard, W&B.
#
#   tensorboard --logdir outputs/hydra
#   wandb sync outputs/hydra/<date>/<time>/wandb/offline-run-*
#
# W&B defaults to `offline` so a run never blocks on network or credentials.
# Switch to `online` once `wandb login` has been run.

experiment_name: "seed-moe"
run_name: null
output_dir: "${hydra:runtime.output_dir}"
log_level: "INFO"
console: true
structured_jsonl: true

snapshot:
  enabled: true
  save_yaml: true
  save_json: true
  save_cli_args: true
  save_environment: false
  redact_env_keys:
    - "KEY"
    - "TOKEN"
    - "SECRET"
    - "PASSWORD"
    - "PASS"
    - "CREDENTIAL"

tensorboard:
  enabled: true
  log_dir: "${hydra:runtime.output_dir}/tensorboard"

wandb:
  enabled: true
  project: "seed-moe-classifier"
  entity: null
  mode: "offline"      # "online" | "offline" | "disabled"
  group: null
  tags: []
  log_model: false     # upload checkpoints as W&B artifacts

intervals:
  log_every_steps: 10
  device_every_steps: 50
  histogram_every_epochs: 5
  gradient_histogram_every_epochs: 5
  embedding_every_epochs: 5
  attention_every_epochs: 5
  figure_every_epochs: 5   # confusion matrices, expert utilisation, t-SNE

  # Per-term gradient probe. Costs one extra backward per loss term, so it runs
  # rarely. It is the direct empirical test for the conflicts a seven-term
  # objective invites: does L_cos oppose L_ArcFace, does L_KL oppose L_seed.
  # Set to 0 to disable.
  gradient_probe_every_steps: 50

artifacts:
  # Parameter/gradient histograms are large; keep them off for long runs.
  log_parameter_histograms: false
  log_gradient_histograms: false
  log_gradient_norms: true
  # Per-term gradient norms and pairwise cosines at the last shared layer.
  log_per_term_gradients: true

  # Paper Section 6 qualitative results.
  log_confusion_matrices: true
  log_expert_utilization: true
  log_per_class_tables: true
  log_tsne: true
  log_embeddings: false
  log_attention_maps: false

  max_embedding_samples: 64
  max_attention_images: 2
  max_tsne_samples: 2000
  tsne_perplexity: 30.0

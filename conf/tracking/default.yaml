experiment_name: "seed-moe"
run_name: null
output_dir: "${hydra:runtime.output_dir}"
log_level: "INFO"
console: true
structured_jsonl: true

snapshot:
  enabled: true
  save_yaml: true
  save_json: true
  save_cli_args: true
  save_environment: true
  redact_env_keys:
    - "KEY"
    - "TOKEN"
    - "SECRET"
    - "PASSWORD"
    - "PASS"
    - "CREDENTIAL"

tensorboard:
  enabled: true
  log_dir: "${hydra:runtime.output_dir}/tensorboard"

wandb:
  enabled: false
  project: "seed-moe-classifier"
  entity: null
  mode: "offline"
  group: null
  tags: []
  log_model: false

intervals:
  log_every_steps: 10
  device_every_steps: 10
  histogram_every_epochs: 1
  gradient_histogram_every_epochs: 1
  embedding_every_epochs: 5
  attention_every_epochs: 5

artifacts:
  log_parameter_histograms: true
  log_gradient_histograms: true
  log_gradient_norms: true
  log_embeddings: true
  log_attention_maps: true
  max_embedding_samples: 256
  max_attention_images: 4

# @package _global_
#
# STAGE 2 -- hierarchical MoE finetuning (paper Section 5). THE stage-2 recipe.
#
#   SEED_PRETRAIN_BACKBONE=$SEED_OUTPUT_DIR/checkpoints/dino_pretrained_encoder.pth \
#       python main.py finetune
#
# Uses the root defaults for `model/head` (hierarchical_moe) and `model/loss`
# (arcface_kl); this file only owns the training loop. Every ablation, control
# and baseline experiment inherits from it, so anything changed here changes them
# all -- which is the point: the variants must differ only in the one thing
# being ablated.

experiment:
  name: "finetune_hierarchical_moe"
  stage: "finetune"

  # Written into summary.json and used by scripts/generate_plots.py to group
  # rows of the comparison table. `variant` defaults to `name`.
  group: "proposed"
  variant: null

  training:
    epochs: 100
    max_batches: null

    # -----------------------------------------------------------------------
    # SPLIT PROTOCOL -- THE EVALUATION STANDARD FOR THIS STUDY.
    #
    # "stratified" holds out 20 % of the CROPS, stratified on sub-variety, then
    # splits the remainder into a stratified train/validation pair. The model is
    # selected on validation and reported on the held-out test split.
    # `num_folds: 1` keeps one named partition, so "the model" is one model with
    # one test score.
    #
    # THIS IS THE SOLE PROTOCOL THIS STUDY REPORTS UNDER. Every published
    # figure, table and accuracy comes from it, and `python main.py finetune` is
    # the production benchmark command that produces them.
    #
    # The unit of classification is the INDIVIDUAL SEED INSTANCE. That is what
    # stage 0 emits (one square crop per seed), what the taxonomy labels, and
    # what a downstream user presents. Stratifying on sub-variety is what puts
    # all 27 classes on the test side with support proportional to prevalence,
    # so the reported 27-way macro-F1 is a genuine 27-way number rather than a
    # macro average over whichever subset of classes a partition happened to
    # leave there.
    #
    # The split is driven entirely by `cfg.seed` and persisted to
    # `split_manifest.npz`, so it is byte-identical across every variant,
    # ablation, baseline and control -- which is what makes McNemar's exact test
    # valid for the component comparisons in `scripts/generate_plots.py`.
    #
    # The other two values are DORMANT and out of scope. They remain wired up
    # because the splitter supports them and the tests cover them, but no result
    # in this study is produced under either, and a number from one must not be
    # reported beside a number from this one:
    #   "grouped"     -- one unstratified GroupShuffleSplit over the source
    #                    photographs. The test side holds roughly half the
    #                    classes, so a 27-way macro-F1 on it is mechanically
    #                    capped for reasons unrelated to the model.
    #   "grouped_cv"  -- StratifiedGroupKFold over every crop, out-of-fold
    #                    predictions concatenated. Estimates the RECIPE (K
    #                    models contributed), not any one shipped model.
    # Both are photograph-partitioned, and 5 of 27 sub-varieties have crops from
    # exactly ONE photograph -- so neither can score those five classes at all.
    # See RUNBOOK_GROUPED_CV.md, which is marked dormant.
    # -----------------------------------------------------------------------
    split_protocol: "stratified"

    # Section 6.2 reports "consistent performance across all folds"; set
    # num_folds > 1 to switch to StratifiedGroupKFold. Fold test metrics are
    # aggregated as mean +- std, NOT taken from the best fold -- a maximum over
    # K folds has a higher expected value than a single draw.
    num_folds: 1
    test_size: 0.2

    learning_rate: 0.0001
    weight_decay: 0.0001
    clip_grad: 3.0

    # "auto" | "bf16" | "fp16" | "off"; only honoured on CUDA. "auto" resolves to
    # bf16 on Ampere and later, fp16 with a GradScaler on older cards.
    #
    # TRAINING ONLY. Validation, per-fold test and the final held-out evaluation
    # always run in fp32 (see AMP_DISABLED in src/trainers/moe_finetune.py):
    # this trainer produces the rows of the comparison table, and a metric that
    # shifted with the autocast dtype would make the gaps between variants
    # partly an artefact of the card they ran on.
    amp: "auto"

    # cuDNN determinism stays on here, unlike stage 1 -- every variant must see
    # the same kernels as well as the same split. TF32 is a separate axis and is
    # deterministic: the same algorithm every run, accumulated at lower
    # precision. Set allow_tf32: false to reproduce full-fp32 accumulation.
    deterministic: true
    allow_tf32: true
    matmul_precision: "high"

    # -----------------------------------------------------------------------
    # Stage-2 augmentation. The submitted default was flip p=0.0 and nothing
    # else, i.e. each image seen exactly once per epoch, deterministically. SSL
    # invariance of the frozen *encoder* says nothing about the sample efficiency
    # of the *head*, which is ~9 M fresh parameters fit from ~7.5 k images.
    # Set random_resized_crop_scale: null and horizontal_flip_prob: 0.0 to
    # reproduce the submitted configuration (the `wo_stage2_augmentation`
    # ablation does exactly that).
    #
    # The vertical flip is here for the same reason stage 1 uses the full
    # dihedral group: seeds on a tray have no canonical orientation, so it is
    # label-preserving and it destroys nothing.
    # -----------------------------------------------------------------------
    horizontal_flip_prob: 0.5
    random_resized_crop_scale: [0.8, 1.0]
    vertical_flip_prob: 0.5
    rotation_degrees: 0.0

    # Letterbox each crop to a square, with a replicated border, before the
    # resize to `image_size`.
    #
    # A NO-OP on the canonical corpus and that is why it is false. Every crop
    # under `Refined_Samples` is already square (aspect p5/p95 = 1.00/1.00), so
    # `Resize((256, 256))` is a uniform rescale. It matters only for a control
    # run against the legacy `Cropped_Samples` tree, which is 96.6 % non-square
    # with aspect ratios from 0.17 to 3.48: there the resize stretches each crop
    # by a factor set by the seed's ORIENTATION in the photograph, which turns a
    # rigid rotation of the object into a shape change on a task whose classes
    # differ by shape.
    #
    #   SEED_DATA_ROOT=.../Cropped_Samples python main.py finetune \
    #       data.expected_num_samples=9357 \
    #       data.augmentation.crop_ratio=[0.5,2.0] \
    #       experiment.training.pad_to_square=true
    #
    # Applied to the training and the evaluation transform together.
    pad_to_square: false

    # Inverse-frequency sampling over sub-varieties. The hierarchy is 13 rice +
    # 8 millet + 3 + 3, so seed-type accuracy is structurally rice-dominated.
    # Macro-F1 is reported either way; this is the option that trains for it.
    balanced_sampler: false

    # Fraction of training over which the ArcFace margin ramps 0 -> m. Full
    # margin from step 0 is a documented convergence hazard on small backbones
    # and small datasets.
    margin_warmup_fraction: 0.15
    # Fraction over which router gating noise anneals to exactly zero.
    router_noise_fraction: 0.3

    # -----------------------------------------------------------------------
    # Multi-GPU. Read only under `torchrun`; a single process ignores all of it.
    #
    # Stage 2 trains a ~9 M-parameter head against a FROZEN encoder over ~7.5 k
    # images, so DDP inside one run buys much less here than in stage 1 -- and
    # the suites run 18 variants x 5 seeds as independent processes, which
    # parallelises perfectly with no communication at all. Prefer:
    #
    #     python scripts/run_ablations.py --gpus 0,1     # one variant per GPU
    #
    # over torchrun on a single variant. DDP is implemented and correct here
    # (training is sharded; evaluation runs on rank 0 against the same
    # parameters, so every reported metric is the single-process one), but it is
    # the second-best use of a second GPU for this stage.
    # -----------------------------------------------------------------------
    ddp:
      timeout_minutes: 30

    # `auto` continues from the newest valid resume checkpoint under save_path,
    # `false` always starts fresh, an explicit path fails loudly if missing.
    #
    # Stage 2 resumes at EPOCH granularity -- fold, epoch, global step, optimizer
    # moments, best-so-far, RNG -- where stage 1 resumes mid-epoch. That is a
    # judgement about what an epoch costs: stage 1's is tens of minutes, stage
    # 2's is one pass of a small head over 7.5 k images against a frozen trunk.
    resume: false
    resume_every_minutes: 30
    # Stop cleanly with a checkpoint before a hard session limit. null disables.
    max_runtime_minutes: null

    save_interval: 50
    keep_last_n_checkpoints: 1
    save_optimizer_state: false
    save_path: "${oc.env:SEED_OUTPUT_DIR,outputs}/finetune_hierarchical_moe"

    optimizer:
      name: "AdamW"
    scheduler:
      name: "cosine"
      eta_min: 0.0

  validation:
    enabled: true
    every_epochs: 1

    # -----------------------------------------------------------------------
    # CHECKPOINT SELECTION METRIC.
    #
    # Any key `run_epoch` emits: "loss", the per-term loss means, and every key
    # of `HierarchicalEvaluation.scalar_metrics` ("sub_variety/accuracy",
    # "sub_variety/f1_macro", "seed_type/accuracy", "kl_alignment/overall",
    # ...). A key containing "loss" is MINIMISED; everything else is MAXIMISED.
    #
    # Why not "loss", which was the previous default. Evaluation passes no
    # labels, so the ArcFace margin never reaches a validation forward and the
    # validation loss is a margin-free NLL at every epoch -- it is not that the
    # units change under the margin ramp. The problem is what the NLL tracks.
    # The training objective ramps the margin over the first
    # `margin_warmup_fraction` of the run and keeps sharpening the posterior
    # afterwards, so NLL rises on the residual errors faster than it falls on
    # the correct ones. The minimum therefore lands in the early,
    # under-confident regime and is close to unrelated to the accuracy optimum.
    #
    # Measured on the shipped 100-epoch run (`outputs/finetune_hierarchical_moe`):
    #
    #     validation loss  min at epoch 6 (0.7626) -> epoch 100 (1.1247), +47.5 %
    #     test accuracy    epoch 6 0.8159 -> epoch 100 0.8173   (+0.15 pp)
    #     test macro F1    epoch 6 0.7910 -> epoch 100 0.7943   (+0.33 pp)
    #     McNemar exact p = 0.87 -- the two are statistically indistinguishable
    #     ECE             epoch 6 0.1381 -> epoch 100 0.0767    (IMPROVED)
    #
    # i.e. selecting on loss discarded 94 epochs of calibration improvement to
    # buy nothing measurable, and reported epoch 6 as "best" on a criterion
    # that had stopped tracking the quantity the results table reports.
    #
    # `sub_variety/f1_macro` rather than `sub_variety/accuracy`: the corpus runs
    # 277 to 1,514 crops per class, so accuracy is dominated by LittleMillet and
    # KodoMillet, and macro-F1 is the headline column of
    # `scripts/generate_plots.py`'s table. Selecting on the metric the table
    # leads with is the honest choice. Both are computed from margin-free
    # `sub_logits`, so neither can be moved by the margin schedule.
    # -----------------------------------------------------------------------
    monitor: "sub_variety/f1_macro"

  # Computational efficiency measurement, run once against the best checkpoint.
  # Profiles encoder + head together, which is the only combination whose
  # latency a deployment would actually observe.
  efficiency:
    enabled: true
    measure_flops: true
    measure_latency: true
    # batch_sizes[0] doubles as the FLOP-counting batch, so keep 1 first to get
    # a clean per-sample figure.
    batch_sizes: [1, 8, 32]
    # 50 timed iterations, reported as median + IQR. Ten iterations on a
    # contended device gives a mean with no dispersion estimate at all. The
    # sweep also tiles from real, DISTINCT test images: identical rows produce
    # identical routing, hence exactly K expert kernels for the whole batch,
    # which understates sparse-dispatch overhead exactly where batch 32 is
    # meant to measure it.
    warmup: 5
    iterations: 50

# @package _global_
#
# DORMANT -- photograph-disjoint stage-2 cross-validation. OUT OF SCOPE.
#
#     python main.py finetune-grouped
#
# ###########################################################################
# # This configuration is NOT part of this study and produces no published  #
# # result. The sole evaluation standard is the CROP-LEVEL STRATIFIED       #
# # protocol in `finetune_hierarchical_moe.yaml`, run by                    #
# # `python main.py finetune`. Do not report a number from this file        #
# # beside one from the primary benchmark.                                  #
# ###########################################################################
#
# It is kept wired up because the splitter supports `grouped_cv`, the tests
# cover it, and the launch procedure is recorded in `RUNBOOK_GROUPED_CV.md`
# (also marked dormant) -- so that photograph-disjoint generalisation can be
# picked up as separate work later without reconstructing any of it. Nothing in
# the primary pipeline depends on this file existing or having been run, and
# `scripts/generate_plots.py` does not scan for its output directory.
#
# What it does, for the record: `grouped_cv` partitions every crop into 5
# photograph-disjoint folds with `StratifiedGroupKFold` and concatenates the
# out-of-fold predictions, so it holds out no separate test split. The resulting
# number estimates the *recipe* -- K different models contributed predictions --
# rather than any single shipped model's test score.
#
# Why it is not a meaningful standard for the 27-way task as this dataset
# stands: five sub-varieties have crops from exactly one photograph (Baryard,
# Browntop, FingerMillet, PearlMillet, ProsaMillet). Under any
# photograph-partitioned split their entire class falls on one side of the
# boundary, so those five of 27 classes cannot be scored at all -- identically
# for every encoder, including an untrained one. That is a property of the
# corpus, and the fix is a camera rather than a splitter.

defaults:
  - finetune_hierarchical_moe

experiment:
  name: "finetune_grouped_diagnostic"
  group: "stage2_diagnostic"
  training:
    split_protocol: "grouped_cv"
    num_folds: 5
    test_size: 0.0        # grouped_cv holds out no separate test split
    save_path: "${oc.env:SEED_OUTPUT_DIR,outputs}/finetune_grouped_diagnostic"

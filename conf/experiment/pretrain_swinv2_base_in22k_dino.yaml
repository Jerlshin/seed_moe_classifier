# @package _global_
#
# Stage-1 on the ImageNet-22k SwinV2-Base trunk.
#
#   python -m src.trainers.contrastive_pretrain experiment=pretrain_swinv2_base_in22k_dino
#
# This is a CORPUS change, not a capacity change, and the distinction is the
# whole point. `pretrain_swinv2_base_dino` is the capacity control: same IN-1k
# corpus, more parameters. This file changes the *pretraining corpus* of the
# initialisation to ImageNet-22k, which the stage-1 audit measured as worth
# +2.24 pp on the frozen photograph-disjoint readout over the shipped DINO
# encoder -- with zero in-domain training, against the 13.34-hour run's +0.58 pp.
#
# ** Do not adopt this trunk before running `experiment=screen_backbones`. **
# That screen adds `swinv2_base_window16_256.ms_in1k`, which is the control that
# separates the two explanations. If IN-1k Base also scores ~0.63 the effect was
# capacity, and Tiny is then the efficient choice; only if it scores ~0.61 is the
# effect the corpus, and only then is this file the right trunk.
#
# The open question this trunk exists to answer (STAGE1_CHANGES.md, "The one
# question Phase 1 exists to answer"): a frozen IN-22k trunk already reaches the
# level the whole DINO run reached, so does self-distillation add anything ON TOP
# of a strong prior, on 81 scenes? Run this against `P1-F` -- the same trunk,
# frozen, no training -- as the first comparison.
#
# Cost is ~1.8x Small per view. `data.num_workers=16` (B3) buys ~6-9x on the
# loader-bound regime the shipped run was in, so this is affordable.

defaults:
  - pretrain_swinv2_dino

experiment:
  name: "pretrain_swinv2_base_in22k_dino"

  training:
    save_path: "${oc.env:SEED_OUTPUT_DIR,outputs}/pretrain_swinv2_base_in22k_dino"
    shared_backbone_path: "${oc.env:SEED_OUTPUT_DIR,outputs}/checkpoints/dinov2_swinv2_base_in22k_pretrained.pth"

model:
  backbone:
    # IN-22k -> IN-1k. Same window16_256 geometry, so the 8x8 final-stage token
    # grid stage 2's routing consumes is unchanged; only the width moves, and the
    # Eq. 4 projection absorbs that.
    name: "swinv2_base_window12to16_192to256.ms_in22k_ft_in1k"
    feature_dim: 1024

# @package _global_
#
# STAGE 1.5 -- score the stage-1 representation itself. No training.
#
#     python main.py eval-pretrain
#
# The DINO loss is a cross entropy against a teacher that moved during training,
# so it is comparable to nothing -- not across runs, not across checkpoints of
# one run, not against a threshold. This stage measures the representation with
# instruments that fail independently: label-free geometry (RankMe, participation
# ratio, alignment/uniformity), frozen-feature readout (linear probe + a
# parameter-free weighted cosine k-NN), structure recovered without labels
# (k-means, prototype argmax against the taxonomy), and the nuisance the stage was
# supposed to remove.
#
# Three things about this file specifically:
#
# 1. It reads the run's milestones, including `dino_best_encoder.pth` -- the
#    encoder the in-training probe selected and the one stage 2 is handed. That
#    row is the headline; the numbered milestones are what make "did the probe
#    pick the right one" checkable rather than assumed.
# 2. The headline split is **crop-level stratified**, matching the primary
#    pipeline, and `grouped_cv` is off. The photograph-disjoint estimate is
#    reported beside it (`split.also_stratified` is inverted here: the grouped
#    single split is the companion, not the headline) and measured end-to-end by
#    `experiment=finetune_grouped_diagnostic`.
# 3. `random_init` and `imagenet_init` use the same trunk as the run under test,
#    so the "+X pp from self-distillation" figure is not partly an architecture
#    delta.

defaults:
  - override /model/head: dino
  - override /model/loss: dino

model:
  backbone:
    # The trunk comes from `conf/model/backbone/swinv2.yaml`, so the controls are
    # the same architecture as the encoder under test. `checkpoint_path: null`
    # because every encoder row below names its own weights.
    checkpoint_path: null
    pretrained: false
    freeze: true
    drop_path_rate: 0.0

experiment:
  name: "eval_pretrain"
  stage: "eval"
  group: "stage1_evaluation"
  evaluation:
    save_path: "${oc.env:SEED_OUTPUT_DIR,outputs}/eval_pretrain"
    pretrain_run_dir: "${oc.env:SEED_OUTPUT_DIR,outputs}/pretrain_dino"
    shared_backbone_path: "${oc.env:SEED_OUTPUT_DIR,outputs}/checkpoints/dino_pretrained_encoder.pth"
    encoders:
      - label: "dino_best"
        checkpoint: "${experiment.evaluation.pretrain_run_dir}/dino_best_encoder.pth"
        pretrained: false
        role: "primary"
        description: "the probe-selected encoder -- the weights stage 2 is handed"
      - label: "dino_epoch10"
        checkpoint: "${experiment.evaluation.pretrain_run_dir}/dino_backbone_epoch_0010.pth"
        pretrained: false
        role: "milestone"
        description: "10 epochs of in-domain self-distillation"
      - label: "dino_epoch25"
        checkpoint: "${experiment.evaluation.pretrain_run_dir}/dino_backbone_epoch_0025.pth"
        pretrained: false
        role: "milestone"
        description: "25 epochs"
      - label: "dino_epoch50"
        checkpoint: "${experiment.evaluation.pretrain_run_dir}/dino_backbone_epoch_0050.pth"
        pretrained: false
        role: "milestone"
        description: "50 epochs -- the configured budget, reached only if the probe did not plateau first"
      - label: "imagenet_init"
        checkpoint: null
        pretrained: true
        role: "control_imagenet"
        description: "ImageNet-1k weights -- what stage 1 started from, and the bar it must clear"
      - label: "random_init"
        checkpoint: null
        pretrained: false
        role: "control"
        description: "untrained trunk; the floor a linear readout gets from architecture alone"
      - label: "handcrafted_floor"
        kind: "handcrafted"
        checkpoint: null
        pretrained: false
        role: "control"
        description: "10 image statistics -- the floor a reviewer asks about first"
    teacher:
      enabled: false
    split:
      # Crop-level is the primary protocol for this pipeline.
      protocol: "stratified"
      test_size: 0.2
      num_folds: 5
      # Report the photograph-disjoint single split alongside, so the ~18 pp gap
      # is measured on THIS encoder rather than quoted from the previous one.
      # It is a reported diagnostic, never an input to a headline number.
      also_stratified: true
    grouped_cv:
      enabled: false
    reuse_cached_features: true
    geometry_max_samples: 6000
    probe:
      regularisation_grid: [0.01, 0.1, 1.0, 10.0, 100.0]
      max_iterations: 2000
      cv_encoders: ["dino_best", "imagenet_init"]
      low_shot_shots: [1, 2, 5, 10, 25]
      low_shot_repeats: 5
      low_shot_encoders: ["dino_best", "imagenet_init"]
    knn:
      k_values: [1, 5, 10, 20]
      temperature: 0.07
    clustering:
      enabled: true
    retrieval:
      enabled: true
      k_values: [1, 5, 10]
    readout:
      stages: ["pooled", "stage3"]
    layerwise:
      enabled: true
      all_encoders: true
      encoders: ["dino_best", "imagenet_init"]
    nuisance:
      enabled: true
      folds: 3
    invariance:
      enabled: true
      encoders: ["dino_best", "imagenet_init"]
      max_samples: 1500
    prototypes:
      enabled: false
      probe_bottleneck: false
    tsne:
      perplexity: 30.0
      max_samples: 3000
      encoders: ["dino_best", "imagenet_init", "random_init"]
    efficiency:
      enabled: true
      batch_sizes: [1, 8, 32]
      warmup: 3
      iterations: 20
      measure_flops: true
    dynamics:
      enabled: true
      events_path: null
    figures:
      enabled: true
      dpi: 300
      retrieval_examples: true
      retrieval_rows: 6
      retrieval_neighbours: 5
    batch_size: 32
    num_workers: 2
    max_samples: 0

# @package _global_
#
# The frozen-trunk reference. NO TRAINING, and that is the point.
#
#   python -m src.trainers.pretrain_eval experiment=eval_frozen_reference
#   python scripts/run_stage1_ablations.py --arms conf/stage1_arms/phase1.yaml --only P1-F
#
# This is `P1-F` of the STAGE1_CHANGES.md sequence, and it is the first number to
# look at in any stage-1 comparison. The audit's decomposition of the shipped
# encoder is `random 0.3804 -> +0.2449 ImageNet-1k -> +0.0031 DINO`: the
# initialisation is worth 79x what 13.34 GPU-hours of self-distillation bought.
# A frozen IN-22k trunk, with zero in-domain training, already beats the shipped
# DINO encoder by +2.24 pp on the readout stage 2 uses.
#
# So the question is no longer "can stage 1 be improved" but:
#
#     Does self-distillation add anything on top of a strong prior, on 81 scenes?
#
# If no arm beats this row by more than a fold SD (+-0.10 on the 27-way probe),
# stage 1 as an OBJECTIVE is not earning its compute, and the honest paper claim
# changes from "in-domain SSL adapts the encoder" to "in-domain SSL removes
# photograph nuisance (see the nuisance table) without improving the readout".
#
# Point it at whichever trunk Phase 0 chose:
#
#     python -m src.trainers.pretrain_eval experiment=eval_frozen_reference \
#         model.backbone.name=swinv2_base_window12to16_192to256.ms_in22k_ft_in1k \
#         model.backbone.feature_dim=1024

defaults:
  - eval_pretrain_representation

experiment:
  name: "eval_frozen_reference"
  group: "stage1_reference"

  evaluation:
    save_path: "${oc.env:SEED_OUTPUT_DIR,outputs}/eval_frozen_reference"

    # There is no stage-1 run behind this row, so everything that reads one is off.
    teacher:
      enabled: false
    prototypes:
      enabled: false
    dynamics:
      enabled: false
    shared_backbone_path: null

    encoders:
      - label: "imagenet_init"
        checkpoint: null
        pretrained: true
        role: "primary"
        description: "the frozen trunk with NO in-domain training -- the reference stage 1 must beat"

      - label: "random_init"
        checkpoint: null
        pretrained: false
        role: "control"
        description: "untrained trunk; the architecture-only floor"

      - label: "handcrafted_floor"
        kind: "handcrafted"
        checkpoint: null
        pretrained: false
        role: "control"
        description: "10 image statistics -- the floor a deep encoder must beat (0.5360 in the audit)"

    probe:
      cv_encoders: ["imagenet_init"]
      low_shot_encoders: ["imagenet_init"]
    invariance:
      encoders: ["imagenet_init"]
    tsne:
      encoders: ["imagenet_init", "random_init"]

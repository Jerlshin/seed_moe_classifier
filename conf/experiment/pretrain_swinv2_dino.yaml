# @package _global_
#
# Stage 1: self-supervised pretraining (paper Section 4, Table 1).
#
#   python main.py pretrain
#
# DINO (Caron et al., 2021) with a SwinV2 trunk, plus KoLeo and Sinkhorn-Knopp
# from DINOv2. Values Table 1 states are annotated `# Table 1`; values the
# revision changed carry the reason.

defaults:
  - override /model/head: dino
  - override /model/loss: dino

experiment:
  name: "pretrain_swinv2_dino"
  stage: "pretrain"

  training:
    epochs: 300                    # Table 1
    max_batches: null              # cap batches/epoch for smoke runs
    learning_rate: 0.0005          # Section 6.1: "initial learning rate of 0.0005"
    clip_grad: 3.0                 # Table 1: "Clip Gradient 3"
    freeze_last_layer_epochs: 1    # Section 6.1: last layer frozen for first epoch

    # -----------------------------------------------------------------------
    # Teacher momentum, now SCHEDULED. Table 1 fixes 0.996; DINO cosine-anneals
    # 0.996 -> 1.0, the point being a fast-adapting teacher early and a stable
    # target late. A constant 0.996 gives neither end of that trade-off. Set
    # momentum_teacher_final: null to hold it constant.
    # -----------------------------------------------------------------------
    momentum_teacher: 0.996        # Table 1
    momentum_teacher_final: 1.0

    # Weight decay, likewise scheduled: DINO cosine-schedules 0.04 -> 0.4. The
    # submitted constant 0.01 is below even DINO's starting value.
    weight_decay: 0.04
    weight_decay_final: 0.4

    # Every collapse guard in DINO is a batch statistic, and batch 16 is far
    # below the regime they were designed for. Accumulate to an effective batch
    # of >= 64 before stepping.
    #
    # -----------------------------------------------------------------------
    # effective_batch_size is the AUTHORITY. When it is set, the trainer derives
    #
    #     gradient_accumulation_steps = effective_batch_size
    #                                   / (data.batch_size x world_size)
    #
    # and refuses to start if that does not divide exactly. So one GPU at 16x4,
    # two GPUs at 16x2 and four at 16x1 are all the same 64 images per optimizer
    # step -- which is the point, because the learning rate, the teacher momentum
    # schedule and every collapse guard are tuned to that number. Raising
    # data.batch_size, or launching on more GPUs, now adjusts the accumulation
    # instead of silently changing the run.
    #
    # Holding data.batch_size fixed per rank is also what keeps the objective
    # identical: Sinkhorn and KoLeo are batch statistics and are already computed
    # per MICRO-batch, so a rank seeing 16 images per micro-batch computes the
    # same function as a single-GPU run does. (Set
    # model.loss.distributed_sinkhorn=true to normalise over the global batch
    # instead -- exact, but a different objective.)
    #
    # Set to null to fall back to the literal gradient_accumulation_steps below,
    # in which case the effective batch scales with the world size and the
    # trainer warns about it.
    # -----------------------------------------------------------------------
    effective_batch_size: 64
    gradient_accumulation_steps: 4    # used only when effective_batch_size is null

    # -----------------------------------------------------------------------
    # Execution. None of this changes the objective; all of it changes the
    # wall clock. See the module docstring of
    # src/trainers/contrastive_pretrain.py for what each one buys.
    # -----------------------------------------------------------------------

    # "auto" | "bf16" | "fp16" | "off". "auto" resolves to bf16 on Ampere and
    # later, fp16 with a GradScaler on older CUDA cards, off on CPU/MPS.
    #
    # This is the single largest speedup available and the objective survives it
    # intact, because the three pieces that fp16 genuinely cannot hold are
    # pinned to fp32 inside the autocast region by src/losses/dino.py: the
    # Sinkhorn log-space normaliser (unit logits at tau=0.04 reach exp(25)), the
    # prototype log-softmax over 8,192 classes, and the KoLeo pairwise distances
    # (near-duplicate crops underflow to zero distance in half precision).
    amp: "auto"

    # SwinV2's window attention is cosine attention, which timm only runs
    # eagerly: per block, autograd materialises AND saves two full
    # [B*nW, heads, N, N] matrices (the pre-scale q^k^T product, kept for the
    # logit_scale gradient, and the softmax output). Summed over SwinV2-Base's
    # 24 blocks at 96 student views that is ~12 GB of bf16 activations per
    # micro-batch -- the largest single consumer of memory capacity and
    # bandwidth in the step, and what caps the physical batch. torch.compile
    # does not remove it (inductor's SDPA pattern-matcher does not recognise
    # the cosine-attention chain; measured, not assumed).
    #
    # The same function IS expressible with F.scaled_dot_product_attention:
    # fold the clamped per-head logit scale into the normalised q, pass the
    # relative-position bias (+ shift mask) as attn_mask, set scale=1.0.
    # Algebraically identical -- tests/test_throughput.py pins values and
    # gradients in fp64 -- and the fused kernel stores a logsumexp instead of
    # the N^2 matrices. Each module is parity-checked against its own stock
    # forward at conversion time -- in fp64, on a copy, because an in-dtype
    # probe on a TF32-capable card measures kernel selection (~5e-4) instead
    # of algebra and refuses correct modules -- and left on the eager path
    # (with a warning naming the measured error) if this timm's semantics have
    # actually drifted. scripts/diagnose_sdpa_parity.py prints the per-module
    # report.
    #
    # With this on, activation memory stops being the batch-size constraint:
    # prefer  data.batch_size=64 gradient_accumulation_steps=1  (identical
    # effective batch, one forward at 384 views, and the Sinkhorn/KoLeo batch
    # statistics computed over the full effective batch -- the regime they were
    # designed for). On a 12 GB card, if 64 does not fit, keep the effective
    # batch with  data.batch_size=32 gradient_accumulation_steps=2.  Measure
    # with scripts/bench_pretrain_step.py before committing a 300-epoch run.
    sdpa_attention: true

    # torch.compile. Costs a few minutes of graph capture on the first step and
    # then fuses the pointwise chains around SwinV2's attention and MLP blocks.
    #
    # enabled: "auto" compiles wherever a kernel can actually be produced --
    # CUDA, compute capability >= 7.0 (a T4 qualifies), and Triton importable --
    # and stays eager otherwise. That is what lets this one file run unchanged on
    # a Linux CUDA box, on Kaggle's T4s, on Windows (where the wheels ship no
    # Triton) and on CPU. `true` forces it and downgrades with a warning if the
    # platform cannot; `false` never compiles. Which of the three happened is
    # logged and written into the run's event stream.
    #
    # mode: "default" is what is recommended here. "reduce-overhead" adds CUDA
    # graphs, which capture parameter pointers -- harmless for the student, but
    # the teacher's parameters are rewritten in place by the EMA every step, and
    # there is nothing to gain by taking that risk on a trunk that already runs
    # under no_grad. "max-autotune" spends much longer searching and rarely wins
    # on a fixed-shape transformer.
    compile:
      enabled: "auto"
      mode: "default"

    # Recompute student activations in backward instead of storing them: roughly
    # half the activation memory for roughly a third more compute. This is a way
    # to AFFORD a larger physical batch, not a speedup by itself -- enable it
    # together with a raised data.batch_size, or leave it off. It also tends to
    # fight torch.compile (graph breaks at every checkpoint boundary).
    grad_checkpointing: false

    # NHWC. Only the patch-embed convolution benefits; SwinV2's blocks are
    # already channel-last internally. Measure before enabling.
    channels_last: false

    # Multi-tensor AdamW. Falls back automatically if the build lacks it.
    fused_optimizer: true

    # OOM valve: split the stacked view tensor into chunks of this many images
    # before the backbone. Lowers the peak of any single forward; does nothing
    # for the accumulated autograd graph. null = one forward for all 6B views.
    forward_chunk_size: null

    # cuDNN autotuning is on because every batch has an identical shape here
    # (drop_last plus a fixed 256 px window), which is exactly the case it wins.
    # Stage 1 emits one checkpoint rather than a row in a comparison table, so it
    # does not need bitwise determinism; stage 2, where variants must be
    # comparable, keeps it. Set deterministic: true to trade throughput for it.
    deterministic: false
    cudnn_benchmark: true
    allow_tf32: true
    matmul_precision: "high"

    # -----------------------------------------------------------------------
    # Multi-GPU. Nothing here is read on a single process.
    #
    #   torchrun --standalone --nproc_per_node=2 \
    #       -m src.trainers.contrastive_pretrain experiment=pretrain_swinv2_dino
    #   python main.py pretrain --gpus 2        # same, with the run id pinned
    #
    # Images are sharded by a DistributedSampler; VIEWS are not, because Eq. 1
    # pairs a student view against the teacher's output for the same image, so a
    # sample's views have to be resident on one device. Gradients are all-reduced
    # by DDP at accumulation boundaries only (see DINO.no_sync).
    # -----------------------------------------------------------------------
    ddp:
      # Collective timeout. Generous because the first step of a compiled run can
      # spend minutes in graph capture while its peers wait in a barrier.
      timeout_minutes: 30
      # Gradients alias DDP's reduction buckets instead of being copied into
      # them: one full gradient's worth of memory back, which on a 16 GB T4 is
      # the difference between fitting and not.
      gradient_as_bucket_view: true
      # Promise the autograd graph is identical every iteration so DDP can
      # re-use its bucket plan. True in practice here, but off by default: a
      # wrong promise surfaces as a hang at the end of an epoch, not an error.
      static_graph: false
      # Every student parameter receives a gradient every step, so leave this
      # false -- true costs a graph traversal per iteration to rediscover it.
      find_unused_parameters: false
      bucket_cap_mb: null              # null keeps DDP's 25 MB default

    # -----------------------------------------------------------------------
    # Resume. `auto` continues from the newest VALID checkpoint under save_path
    # and starts fresh when there is none, so one command line works for the
    # first launch and every relaunch after a session ends. `false` always starts
    # fresh; an explicit path fails loudly if it is missing.
    #
    # The resume checkpoint is a different file from the interval checkpoints
    # above and carries much more: teacher, optimizer moments, scheduler,
    # GradScaler, epoch, global step, micro-batch within the epoch, and every
    # rank's RNG state. It is ~1.5 GB for SwinV2-Base, two are kept, and that is
    # deliberate -- on a preempted instance the newest file is the one most
    # likely to have been interrupted, and the previous one is the fallback.
    # -----------------------------------------------------------------------
    resume: false
    # Wall-clock save interval. The trigger that matters on a session-limited
    # platform: `save_interval: 50` epochs can easily exceed the whole session,
    # in which case a killed run has produced nothing.
    resume_every_minutes: 30
    # How often the ranks compare notes about saving and stopping. Both triggers
    # are wall-clock and so differ per rank; agreeing on a step index is what
    # keeps the collective write in lockstep.
    resume_check_every_steps: 20
    # Replay the already-consumed micro-batches of a partially finished epoch so
    # the resume lands exactly where it stopped. Costs their augmentation time.
    # false restarts the epoch instead.
    resume_fast_forward: true
    # Stop cleanly (with a checkpoint) after this many minutes. Set it a few
    # minutes under a hard session limit -- more reliable than being signalled,
    # since not every platform signals before it kills. null disables it.
    max_runtime_minutes: null

    save_interval: 50
    keep_last_n_checkpoints: 1
    save_full_checkpoints: false
    save_teacher_in_checkpoints: false
    save_path: "${oc.env:SEED_OUTPUT_DIR,outputs}/pretrain_swinv2_dino"

    # Where the finished backbone is published for every downstream run. The
    # ablation and baseline suites all read this one file, so each variant starts
    # from byte-identical encoder weights and the comparison measures the
    # architecture rather than a second roll of the self-supervised dice.
    # Set to null to skip publishing.
    shared_backbone_path: "${oc.env:SEED_OUTPUT_DIR,outputs}/checkpoints/dinov2_swinv2_pretrained.pth"

    optimizer:
      name: "AdamW"                # Section 6.1
    scheduler:
      name: "cosine"               # Section 6.1: "cosine decay scheduler"
      t_max: null                  # defaults to `epochs`
      eta_min: 0.0

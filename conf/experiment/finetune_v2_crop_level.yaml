# @package _global_
#
# Stage 2 for the v2 pipeline: crop-level stratified train / validation / test.
#
#     SEED_PRETRAIN_BACKBONE=$SEED_OUTPUT_DIR/checkpoints/dino_v2_swinv2_tiny.pth \
#         python main.py finetune-v2
#
# WHAT THE PROTOCOL IS
# ====================
#
# `split_protocol: stratified` holds out 20 % of the **crops**, stratified on
# sub-variety, then splits the remainder into a stratified train/validation pair.
# The model is selected on validation and reported on the held-out test split,
# which is the flow the v2 pipeline specifies. `num_folds: 1` keeps a single
# named train/val/test partition rather than cross-validating, so "the model"
# is one model with one test score.
#
# WHAT THAT NUMBER MEANS, STATED ONCE AND PLAINLY
# ===============================================
#
# The 9,357 crops come from **81 source photographs** -- a mean of 115 crops per
# photograph, cut from the same tray under the same lighting, frequently with
# overlapping bounding boxes. Crop-level splitting therefore puts near-duplicate
# views of the same physical seeds on both sides of the boundary, and the
# measured accuracy is substantially a within-photograph score.
#
# The size of the effect is measured, not asserted. Under the identical frozen
# encoder and probe, `outputs/eval_pretrain/tables/split_protocol_delta.csv`:
#
#     27-way probe accuracy   photograph-disjoint 0.6500 -> crop-level 0.8365   (+18.65 pp)
#     27-way k-NN accuracy    photograph-disjoint 0.5099 -> crop-level 0.6891   (+17.92 pp)
#     retrieval P@1           0.4745 with same-photograph neighbours excluded, 0.6636 without
#
# and 89-98 % of the crops in a photograph have a neighbour above cosine 0.95 at
# 32 x 32 grey. So a crop-level number is ~18 pp above what the same encoder
# would score on an unseen photograph, and it is the right number for the
# question "how well does this classify a new crop from a known acquisition
# session" and the wrong one for "how well does this classify a new session".
#
# This file reports the leakage explicitly rather than leaving it to be inferred:
# `leakage_report` is run for both protocols and `shared_source_groups`,
# `leaked_test_fraction` and `classes_present_in_test` land in `summary.json`
# for every run. `conf/experiment/finetune_v2_grouped_diagnostic.yaml` is the
# same configuration under photograph-disjoint splitting, kept as a secondary
# diagnostic so the delta stays measurable on the v2 encoder rather than being
# quoted from the old one.
#
# WHAT ELSE CHANGES FROM `finetune_hierarchical_moe`
# ==================================================
#
# Only the split and the augmentation. The head, the loss, the routing width and
# every component toggle are inherited, so a v2 number and a v1 number differ by
# the encoder and the protocol and by nothing else.
#
# The stage-2 augmentation gains the two lossless dihedral elements stage 1 uses.
# Seeds on a tray have no canonical orientation, ~9 M freshly-initialised head
# parameters are being fit from ~6 k training crops, and a vertical flip costs
# nothing and destroys nothing.

defaults:
  - finetune_hierarchical_moe

experiment:
  name: "finetune_v2_crop_level"
  group: "stage2_v2"
  training:
    # Crop-level. See the header for what this number does and does not measure.
    split_protocol: "stratified"
    num_folds: 1
    test_size: 0.2
    horizontal_flip_prob: 0.5
    vertical_flip_prob: 0.5
    random_resized_crop_scale: [0.8, 1.0]
    save_path: "${oc.env:SEED_OUTPUT_DIR,outputs}/finetune_v2_crop_level"
  validation:
    enabled: true
    every_epochs: 1
    monitor: "loss"

# Phase 1 of the STAGE1_CHANGES.md sequence: five 50-epoch arms plus the
# frozen-trunk reference, on one chosen trunk and one corpus.
#
#   python scripts/run_stage1_ablations.py --arms conf/stage1_arms/phase1.yaml
#
# Every arm is one set of Hydra overrides on top of `experiment`. Nothing here is
# hard-coded in Python: to add an arm, add an entry.
#
# Read the sequence's own rules before editing:
#
#  * A1 (KoLeo per view) is the new BASELINE for everything below it, because it
#    changes the quantity most of the other arms are trying to move. P1-0 is
#    therefore the *old* behaviour, kept as the reference the fix is measured
#    against -- it is not the recommended recipe.
#  * (A1, C1) and (C1, C2) both act on alignment and on the local/global upsample
#    gap; (C3, C9) both move the teacher's entropy floor log(K/B_teacher);
#    (B1, C4) both concern which stage carries the signal. Do not combine them.
#  * C9 (physical batch) moves the LR *and* the entropy floor, so it is set ONCE
#    before Phase 1 and never run as an arm beside C3.
#
# Judge on `oof_probe_sub_accuracy_testable_classes` and `oof_probe_sub_f1_macro`
# at the readout Phase 0 chose, with the fold SD -- and on E9's within-class
# photograph decodability, because an arm can win the probe by re-learning the
# photograph confound.

# Base Hydra experiment every arm composes on top of. Override on the command
# line with --experiment once Phase 0 has chosen the trunk, e.g.
#   --experiment pretrain_swinv2_tiny_dino
experiment: pretrain_swinv2_dino

# Applied to every arm, before the arm's own overrides.
#
# 50 epochs (C6): the shipped run's milestone probes were 0.6276 / 0.6358 /
# 0.6284 at 25 / 50 / 100 against a fold SD of +-0.10, so 100 epochs of the
# CURRENT recipe bought nothing measurable. After A1 and C1 the recipe is
# different and the milestone curve has to be re-measured, which is what
# save_epochs is for.
common:
  - experiment.training.epochs=50
  - experiment.training.save_epochs=[10,25,50]
  # B3/G1. Changes who computes an augmentation, never what it is.
  - data.num_workers=16

arms:
  - name: P1-F
    description: >-
      The frozen chosen trunk, NO TRAINING AT ALL. This is the reference that
      decides whether stage 1 is worth running: a frozen IN-22k trunk already
      reaches the level the 13.34-hour DINO run reached, so if no arm beats this
      by more than a fold SD, the objective is not earning its compute and the
      honest claim changes from "in-domain SSL adapts the encoder" to "in-domain
      SSL removes photograph nuisance without improving the readout".
    train: false
    evaluate_frozen: true

  - name: P1-0
    description: >-
      Baseline: the PRE-AUDIT recipe on the chosen trunk and corpus. KoLeo across
      both global views, exactly as the shipped encoder was trained. Reference
      for every arm below; not a recommendation.
    overrides:
      - model.loss.koleo_scope=all_views

  - name: P1-A
    description: >-
      A1 -- KoLeo per global view, the DINOv2 reference behaviour. Single factor
      against P1-0. Judged on invariance/alignment,
      invariance/same_image_minus_same_class, invariance/self_retrieval_top1 and
      the headline probe. Watch spectrum/rankme and participation_ratio: a
      collapse toward ImageNet's 9.1 with no probe gain would mean KoLeo was
      doing useful work and lambda_koleo should rise instead.
    overrides:
      - model.loss.koleo_scope=per_view

  - name: P1-B
    description: >-
      A1 + C8 -- lambda_koleo=0. The control that says whether KoLeo helps at all
      on this data once it is no longer fighting Eq. 1. Cheap and necessary: if
      P1-A and P1-B are indistinguishable, the A1 fix bought its gain by removing
      a harmful term rather than by improving a useful one.
    overrides:
      - model.loss.koleo_scope=per_view
      - model.loss.lambda_koleo=0.0

  - name: P1-C
    description: >-
      A1 + C1 -- local and global crop scales. Local views currently carry a
      median 598 native pixels (p5 = 130) inflated to 65,536, and 8 of the 10
      cross-view terms in Eq. 1 involve one. This raises the local scale to
      (0.30, 0.70) at 160 px and narrows the globals to (0.70, 1.0), bringing the
      local upsample factor from 10.5x to 6.7x against the globals' 5.1x. Three
      knobs move together; if it wins, split it. Expect a HIGHER reported CE and
      a lower KL -- read train/teacher_student_kl, not train/loss.
    overrides:
      - model.loss.koleo_scope=per_view
      - data.augmentation.local_crops_scale=[0.30,0.70]
      - data.augmentation.global_crops_scale=[0.70,1.0]
      - data.local_crop_size=160

  - name: P1-D
    description: >-
      A1 + C3 -- EMA centering instead of Sinkhorn. Sinkhorn was adopted because
      the EMA centre was noise-dominated at K=65,536, m=0.9 and 32 vectors/step
      (0.005 samples per dimension). That argument expired: at K=2,048, m=0.99
      and 128 vectors/step it is 6.25 samples per dimension, 20x better than
      DINO's own ImageNet setting. What remains is Sinkhorn's cost -- an entropy
      floor of log(K/B_teacher) and a target spread over ~215 prototypes, which
      carries little instance identity to match. Watch prototype_perplexity and
      prototype_kl_to_uniform: a perplexity collapsing from ~2,030 toward tens is
      the failure mode EMA centering is known for.
    overrides:
      - model.loss.koleo_scope=per_view
      - model.loss.centering=ema
      - model.loss.center_momentum=0.99

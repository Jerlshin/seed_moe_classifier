# Phase 2 of the STAGE1_CHANGES.md sequence: resolve the Phase-1 survivors.
#
#   python scripts/run_stage1_ablations.py --arms conf/stage1_arms/phase2.yaml \
#       --experiment pretrain_swinv2_tiny_dino
#
# Phase 2 is defined relative to Phase 1's winner, so this file is a TEMPLATE
# with the winning arm's overrides marked. Edit `common` to carry whichever of
# P1-C or P1-D won -- the arms below then sit on top of it, which is what makes
# them single-factor against that winner rather than against P1-0.
#
# Leaving `common` as shipped runs C2 and C4 on top of the A1 fix alone, which is
# the correct thing to do if neither C1 nor C3 beat P1-A.

experiment: pretrain_swinv2_dino

common:
  - experiment.training.epochs=50
  - experiment.training.save_epochs=[10,25,50]
  - data.num_workers=16
  # A1 is the baseline for everything from here on.
  - model.loss.koleo_scope=per_view
  # --- PASTE THE PHASE-1 WINNER'S OVERRIDES HERE ---
  # e.g. for P1-C:
  #   - data.augmentation.local_crops_scale=[0.30,0.70]
  #   - data.augmentation.global_crops_scale=[0.70,1.0]
  #   - data.local_crop_size=160

arms:
  - name: P2-BASE
    description: >-
      The Phase-1 winner, re-run at this phase's settings. The reference every
      arm below is compared against; without it the Phase-2 deltas would be
      measured across a phase boundary.
    overrides: []

  - name: P2-C2
    description: >-
      C2 -- match_view_lowpass. Puts the global views through the same
      downsample-then-upsample cycle the locals undergo, so the resolution
      artefact stops identifying a view as local (a median 10.5x upsample against
      5.7x, p95 22.1x against 9.9x). THIS IS THE ARM MOST LIKELY TO HURT: it
      low-passes the globals too, on data that already has almost no
      high-frequency content. Worth running precisely because the argument for it
      is theoretical and the argument against it is measurable. It interacts
      strongly with C1, which also narrows the upsample gap, so it must sit on
      top of the C1 winner rather than beside it.
    overrides:
      - data.augmentation.match_view_lowpass=true

  - name: P2-C4
    description: >-
      C4 -- a second DINO head on the mean-pooled layers.2 output, with its own
      prototypes. Fixes what B1 cannot: B1 changes WHERE stage 2 reads, this
      changes what the deep layers are optimised FOR. RUN THIS ONLY AFTER the
      readout decision has landed -- the two are confounded. Judge on
      layerwise_probe/stage3 against the P2-BASE arm, and on cka_vs_imagenet_init
      per stage, which should rise at layers.3 and fall at layers.2. If
      layers.2's probe does not move, the answer is no.
    overrides:
      - model.head.aux_stage=2
      - model.head.aux_weight=1.0

  - name: P2-100EP
    description: >-
      The Phase-1 winner at 100 epochs. C6: the shipped run's 50-vs-100 flatness
      was measured on the OLD recipe, and 80 % of its apparent loss improvement
      was the teacher's entropy. After A1 the recipe is different, so the epoch
      budget has to be re-decided on the milestone probes of the WINNING arm.
    overrides:
      - experiment.training.epochs=100
      - experiment.training.save_epochs=[10,25,50,100]

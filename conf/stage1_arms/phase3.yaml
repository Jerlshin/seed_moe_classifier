# Phase 3 of the STAGE1_CHANGES.md sequence: confirm, with error bars.
#
#   python scripts/run_stage1_ablations.py --arms conf/stage1_arms/phase3.yaml \
#       --seeds 42 43 44
#
# Nothing before this is reportable. The stage-1 evaluation's own fold SD is
# +-0.10 on the 27-way probe, so a single arm cannot resolve anything below
# ~2 pp, and the component effects in play are 0.5-4 pp. Three seeds of the
# winning configuration and three of the baseline is the minimum that turns a
# ranking into a claim.
#
# Edit `common` to carry the winning configuration from Phase 2, exactly as
# Phase 2 carried Phase 1's.

experiment: pretrain_swinv2_dino

common:
  - experiment.training.epochs=100
  - experiment.training.save_epochs=[10,25,50,100]
  - data.num_workers=16

arms:
  - name: P3-BASELINE
    description: >-
      The pre-audit recipe at three seeds. The comparison's other half: without
      seed-level spread on the BASELINE too, a difference of means has no error
      bar to be judged against.
    overrides:
      - model.loss.koleo_scope=all_views

  - name: P3-WINNER
    description: >-
      The Phase-2 winning configuration at three seeds. Paste its overrides here
      (they are recorded verbatim in each arm's summary.json under
      `loss_flags` and `config`, so this is a copy rather than a reconstruction).
    overrides:
      - model.loss.koleo_scope=per_view

  - name: P3-FROZEN
    description: >-
      The frozen chosen trunk again, carried through to the final table. It has
      no seed -- there is no training -- but it is the row that decides whether
      the whole stage earned its compute, and a results table without it invites
      the reader to assume it was checked.
    train: false
    evaluate_frozen: true

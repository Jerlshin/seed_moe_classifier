[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seed-moe-classifier"
version = "0.2.0"
description = "Hierarchical seed classifier: DINO self-supervised pretraining plus a Mixture-of-Experts head."
requires-python = ">=3.11"
dependencies = [
    "hydra-core",
    "lightly",
    "matplotlib",
    "numpy",
    "omegaconf",
    # Stage 0 (src/segmentation): image decode, morphology, distance transform,
    # inpainting and template matching. Headless build -- nothing here opens a
    # window, and the GUI variant pulls Qt onto a rented GPU box for nothing.
    "opencv-python-headless",
    "pillow",
    "psutil",
    "scikit-image",   # peak_local_max, watershed (stage 0)
    "scikit-learn",
    "scipy",          # ndimage: labelling, hole filling (stage 0)
    "timm",
    "torch",
    "torchvision",
]

[project.optional-dependencies]
tracking = [
    "pynvml",
    "tensorboard",
    "wandb",
]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
markers = [
    "slow: tests that download weights or run a full training stage",
]
